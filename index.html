<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mehfil FM — ad-free Indian radio for every mood.">
<meta name="theme-color" content="#ffb35d">
<title>Mehfil FM — Indian Radio</title>
<style>
:root{--accent:#ffb35d;--rgb:255,179,93;--text:#fff8ed;--panel:rgba(18,11,7,.82);--line:rgba(255,248,230,.27)}
*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}
body{background:#120a06;color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.scene,.veil{position:fixed;inset:0}
.scene{background:#1b1008 center/cover no-repeat;transition:opacity .7s,transform 1s;transform:scale(1.025)}
.scene.next{opacity:0;transform:scale(1.07)}
.veil{pointer-events:none;background:linear-gradient(180deg,#0007 0%,#0002 40%,#000c 100%)}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100svh;padding:22px max(20px,calc((100vw - 1220px)/2));text-shadow:0 2px 14px #0008}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;gap:9px;align-items:center;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:#35dfab;box-shadow:0 0 12px #35dfab;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #35dfab}50%{box-shadow:0 0 22px #35dfab,0 0 40px #35dfab44}}
.theme-select{position:relative}
.theme-toggle,.about{border:1px solid var(--line);border-radius:999px;color:var(--text);background:#130c09a8;backdrop-filter:blur(10px)}
.theme-toggle{min-width:210px;padding:10px 19px;font-size:.8rem;font-weight:800}
.menu{position:absolute;top:calc(100% + 9px);left:50%;display:none;width:250px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#160d0bef;box-shadow:0 18px 40px #0009;transform:translateX(-50%);z-index:10}
.menu.open{display:block}
.menu button{width:100%;padding:11px 15px;border:0;color:var(--text);background:transparent;text-align:left;display:flex;align-items:center;gap:10px;font-size:.88rem}
.menu button:hover,.menu button[aria-current=true]{background:rgba(var(--rgb),.23)}
.about{justify-self:end;padding:9px 15px;color:var(--text);text-decoration:none;font-size:.8rem}
.hero{display:grid;flex:1;place-content:center;justify-items:center;min-height:540px;padding:38px 0 72px;text-align:center}
.kicker{margin:0 0 12px;color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
.title{max-width:900px;margin:0;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(3rem,8.6vw,7.5rem);line-height:.9;letter-spacing:-.06em}
.title em{font-weight:400}
.subtitle{max-width:560px;margin:17px auto;color:#f2dfcb;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(.95rem,2vw,1.15rem);font-style:italic}
.pill{margin:5px 0 18px;padding:8px 17px;border:1px solid rgba(var(--rgb),.6);border-radius:999px;color:var(--accent);background:#130a08a6;font-size:.8rem;font-weight:800}
.player{width:min(100%,580px);padding:16px 18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 65px #000a;backdrop-filter:blur(18px);text-align:left}
.top{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center}
.disc{display:grid;place-items:center;width:52px;height:52px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);background:radial-gradient(circle,rgba(var(--rgb),.5) 0 12%,#130c09 14% 48%,rgba(var(--rgb),.35) 50% 52%,#130c09 54%);flex-shrink:0}
.disc svg{width:20px}
.disc.spinning{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta p{overflow:hidden;margin:0;text-overflow:ellipsis;white-space:nowrap}
.track{font-size:.88rem;font-weight:800}
.channel{margin-top:3px;color:#e7d6c6;font-size:.72rem}
.status{margin-top:4px;display:flex;align-items:center;gap:6px;font-size:.68rem;color:#decbbb}
.dot{width:6px;height:6px;border-radius:50%;background:#35dfab;box-shadow:0 0 6px #35dfab;flex-shrink:0}
.dot.off{background:#555;box-shadow:none}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.icon{display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:50%;color:var(--text);background:#fff1;transition:background .15s}
.icon:hover{background:#fff3}
.icon svg{width:17px;fill:currentColor}
.play{width:52px;height:52px;border-color:var(--accent);color:#1c1008;background:var(--accent)}
.play:hover{filter:brightness(1.1)}
.vol-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.vol-row input{flex:1;height:4px;accent-color:var(--accent);cursor:pointer}
.vol-row svg{width:16px;fill:var(--text);flex-shrink:0;opacity:.7}
/* Search */
.search-wrap{width:min(100%,580px);margin-bottom:16px;position:relative}
.search-wrap input{width:100%;padding:11px 40px 11px 16px;border:1px solid var(--line);border-radius:999px;background:#130c09cc;color:var(--text);font-size:.88rem;backdrop-filter:blur(10px)}
.search-wrap input::placeholder{color:#a08878}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#a08878;font-size:1.1rem;padding:4px;display:none}
.search-clear.show{display:block}
.suggestions-box{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1a0e08;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none;z-index:15;box-shadow:0 12px 30px #0009}
.suggestions-box.show{display:block}
.suggest-item{width:100%;padding:10px 16px;border:0;background:transparent;color:var(--text);text-align:left;font-size:.83rem;cursor:pointer;display:block}
.suggest-item:hover{background:rgba(var(--rgb),.2)}
.suggest-item strong{color:var(--accent)}
.search-results{width:min(100%,580px);margin-bottom:12px;display:none;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.search-results.show{display:flex}
.sr-item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);cursor:pointer;transition:background .15s}
.sr-item:hover{background:rgba(var(--rgb),.15)}
.sr-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#1a0e08}
.sr-meta{min-width:0}
.sr-title{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-sub{font-size:.7rem;color:#c4a98a;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-actions{display:flex;gap:6px;flex-shrink:0}
.sr-btn{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:#fff1;color:var(--text)}
.sr-btn:hover{background:rgba(var(--rgb),.3)}
.sr-btn svg{width:13px;fill:currentColor}
.search-empty{width:min(100%,580px);padding:20px;text-align:center;color:#a08878;font-size:.82rem;display:none}
.search-empty.show{display:block}
.search-loading{width:min(100%,580px);padding:14px;text-align:center;color:#a08878;font-size:.8rem;display:none}
.search-loading.show{display:block}
/* Playlist panel */
.pl-btn{border:1px solid var(--line);border-radius:999px;color:var(--text);background:#130c09a8;backdrop-filter:blur(10px);padding:9px 15px;font-size:.8rem;display:flex;align-items:center;gap:6px}
.pl-btn svg{width:14px;fill:currentColor}
.pl-panel{position:fixed;right:0;top:0;bottom:0;width:320px;background:#160d0bf5;border-left:1px solid var(--line);backdrop-filter:blur(20px);z-index:20;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.pl-panel.open{transform:translateX(0)}
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid var(--line)}
.pl-header h2{margin:0;font-size:.95rem;font-weight:800}
.pl-close{background:none;border:none;color:var(--text);font-size:1.3rem;padding:4px}
.pl-body{flex:1;overflow-y:auto;padding:12px}
.pl-new-btn{width:100%;padding:10px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--accent);font-size:.82rem;margin-bottom:12px}
.pl-new-btn:hover{background:rgba(var(--rgb),.1)}
.pl-card{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.pl-card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer}
.pl-card-head:hover{background:rgba(var(--rgb),.1)}
.pl-name{font-size:.85rem;font-weight:700}
.pl-count{font-size:.7rem;color:#a08878}
.pl-card-actions{display:flex;gap:6px}
.pl-action{background:none;border:none;color:#a08878;font-size:.75rem;padding:3px 6px;border-radius:6px}
.pl-action:hover{color:var(--text);background:rgba(255,255,255,.1)}
.pl-songs{display:none;border-top:1px solid var(--line)}
.pl-songs.open{display:block}
.pl-song{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 12px;font-size:.78rem}
.pl-song:hover{background:rgba(var(--rgb),.08)}
.pl-song-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#1a0e08}
.pl-song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl-song-artist{color:#a08878;font-size:.68rem;margin-top:1px}
.pl-song-del{background:none;border:none;color:#a08878;font-size:.9rem;padding:2px 5px}
.pl-song-del:hover{color:#ff7e9a}
.pl-empty{padding:20px;text-align:center;color:#a08878;font-size:.78rem}
.pl-play-all{width:calc(100% - 24px);margin:8px 12px;padding:8px;border:1px solid var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-size:.78rem;font-weight:700}
.pl-play-all:hover{background:rgba(var(--rgb),.15)}
/* Add-to-playlist modal */
.modal-bg{position:fixed;inset:0;background:#0009;z-index:30;display:none;place-items:center}
.modal-bg.show{display:grid}
.modal{background:#1a0e08;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(90vw,340px);max-height:80vh;overflow-y:auto}
.modal h3{margin:0 0 14px;font-size:.95rem}
.modal-pl-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:.82rem}
.modal-pl-item:hover{background:rgba(var(--rgb),.15)}
.modal-new{width:100%;padding:9px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--accent);font-size:.82rem;margin-top:4px}
.modal-new:hover{background:rgba(var(--rgb),.1)}
.modal-cancel{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#a08878;font-size:.82rem;margin-top:8px}
/* New playlist form */
.pl-form{padding:12px;border-top:1px solid var(--line);display:none}
.pl-form.show{display:block}
.pl-form input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#130c09;color:var(--text);font-size:.82rem;margin-bottom:8px}
.pl-form-btns{display:flex;gap:8px}
.pl-form-btns button{flex:1;padding:8px;border-radius:10px;font-size:.8rem;font-weight:700}
.pl-form-save{border:none;background:var(--accent);color:#1c1008}
.pl-form-cancel{border:1px solid var(--line);background:transparent;color:var(--text)}
/* Toast */
.toast{position:fixed;z-index:40;bottom:20px;left:50%;max-width:calc(100% - 40px);padding:10px 16px;border-radius:10px;background:#21130c;box-shadow:0 10px 30px #0009;transform:translate(-50%,180%);transition:transform .25s;font-size:.82rem;text-shadow:none}
.toast.show{transform:translate(-50%,0)}
.start{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:20px;background:#10080460;backdrop-filter:blur(10px);transition:opacity .4s,visibility .4s}
.start.gone{visibility:hidden;opacity:0}
.start button{padding:22px 36px;border:1px solid #fff8;border-radius:20px;color:#fff;background:#120b09e0;box-shadow:0 18px 50px #000a}
.start strong{display:block;font-size:1.2rem}
.start span{display:block;margin-top:6px;color:#e7d5c6;font-size:.84rem}

@media(max-width:620px){
  .app{padding:15px}
  .brand span{display:none}
  header{grid-template-columns:1fr auto auto}
  .theme-toggle{min-width:140px;padding:9px 13px}
  .hero{min-height:unset;padding:30px 0 50px}
  .title{font-size:clamp(2.5rem,14vw,4rem)}
  .pl-panel{width:100%}
  .about{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="scene" id="scene"></div>
<div class="scene next" id="next-scene"></div>
<div class="veil"></div>
<main class="app">
  <header>
    <div class="brand"><i></i><span>Mehfil FM</span></div>
    <div class="theme-select">
      <button class="theme-toggle" id="toggle" aria-expanded="false">Change theme &middot; <span id="selected"></span></button>
      <div class="menu" id="menu" role="menu"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">
      <button class="pl-btn" id="pl-open-btn" aria-label="Open playlists">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/><circle cx="19" cy="18" r="3" fill="currentColor"/></svg>
        Playlists
      </button>
      <a class="about" href="#" rel="noopener">About</a>
    </div>
  </header>
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="pill" id="pill"></div>
    <!-- Search -->
    <div class="search-wrap">
      <input type="search" id="search-input" placeholder="Search songs, artists… press Enter to search" autocomplete="off">
      <button class="search-clear" id="search-clear" aria-label="Clear search">&#x2715;</button>
      <div class="suggestions-box" id="suggestions-box"></div>
    </div>
    <div class="search-loading" id="search-loading">Searching…</div>
    <div class="search-results" id="search-results"></div>
    <div class="search-empty" id="search-empty">No results found for this search.</div>
    <!-- Player -->
    <div class="player">
      <div class="top">
        <div class="disc" id="disc">
          <svg viewBox="0 0 24 24"><path d="M7 18V6l11-3v12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="18" r="3"/><circle cx="16" cy="15" r="3"/></svg>
        </div>
        <div class="meta">
          <p class="track" id="track">Tap play to start</p>
          <p class="channel" id="channel"></p>
          <div class="status"><span class="dot off" id="dot"></span><span id="status">Ready</span></div>
        </div>
      </div>
      <div class="controls">
        <button class="icon" id="btn-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm12 0v14l-9-7z"/></svg></button>
        <button class="icon play" id="btn-play" aria-label="Play"><svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon" id="btn-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5v14l9-7z"/></svg></button>
      </div>
      <div class="vol-row">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 15.5 12z"/></svg>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 15.5 12zM18.5 12a7 7 0 0 0-4-6.33v12.65A7 7 0 0 0 18.5 12z"/></svg>
      </div>
    </div>
  </section>
</main>
<!-- Playlist panel -->
<aside class="pl-panel" id="pl-panel" aria-label="Playlists">
  <div class="pl-header">
    <h2>My Playlists</h2>
    <button class="pl-close" id="pl-close" aria-label="Close">&#x2715;</button>
  </div>
  <div class="pl-body" id="pl-body">
    <button class="pl-new-btn" id="pl-new-btn">+ Create new playlist</button>
    <div class="pl-form" id="pl-form">
      <input type="text" id="pl-name-input" placeholder="Playlist name" maxlength="40">
      <input type="text" id="pl-desc-input" placeholder="Description (optional)" maxlength="80">
      <div class="pl-form-btns">
        <button class="pl-form-save" id="pl-form-save">Save</button>
        <button class="pl-form-cancel" id="pl-form-cancel">Cancel</button>
      </div>
    </div>
    <div id="pl-list"></div>
  </div>
</aside>
<!-- Add to playlist modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Add to Playlist</h3>
    <div id="modal-pl-list"></div>
    <button class="modal-new" id="modal-new-pl">+ New playlist</button>
    <button class="modal-cancel" id="modal-cancel">Cancel</button>
  </div>
</div>
<audio id="hq-audio" preload="auto" crossorigin="anonymous"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="start" id="start">
  <button id="start-btn">
    <strong>&#9654; Enter Mehfil FM</strong>
    <span>Ad-free Indian music for every mood</span>
  </button>
</div>
<script>
// ── Config ────────────────────────────────────────────────────
const INVIDIOUS = ['https://invidious.f5.si', 'https://invidious.protokolla.fi'];

const THEMES = {
  corporate:{label:'Corporate Majdoor',icon:'💼',title:'Corporate <em>Majdoor</em>',kicker:'9 to 5 · lofi focus beats',sub:'"Chai pe chalte hain?" — lofi bollywood to survive every deadline.',pill:'☕ Focus mode on',image:'assets/corporate-sunset.png',playlist:'PLqn8TmQNZp5owBysoqordPjLha-q7SJmI',accent:'#ffb35d',rgb:'255,179,93'},
  highway:{label:'Highway Raat',icon:'🚛',title:'Highway <em>Raat</em>',kicker:'NH 48 · desi road trip',sub:'Headlights, dhaba chai, and Hindi songs that feel like home on a long road.',pill:'🚌 Horn OK please',image:'assets/highway-raat.png',playlist:'PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy',accent:'#f6a32f',rgb:'246,163,47'},
  nai:{label:'Nai Ki Dukaan',icon:'✂️',title:'Nai Ki <em>Dukaan</em>',kicker:'golden era · purani yaadein',sub:'Kishore, Rafi, Lata — the classics that play on every barbershop radio.',pill:'✂️ Ek number cut',image:'assets/mela-beats.png',playlist:'PLT0TCjjVVGLSI0kKaqkatnFsWZv9RrPJh',accent:'#ffd04e',rgb:'255,208,78'},
  jazz:{label:'Jazz Adda',icon:'🎷',title:'Jazz <em>Adda</em>',kicker:'indian jazz · fusion · instrumental',sub:'Where the sitar meets the saxophone — late night Indian jazz and fusion.',pill:'🎷 Smooth vibes only',image:'assets/corporate-sunset.png',playlist:'PLR5auAn2jtXdjSozf_pJN899DtvOY5-Xi',accent:'#a78bfa',rgb:'167,139,250'},
  blues:{label:'Blues Gali',icon:'🎸',title:'Blues <em>Gali</em>',kicker:'indian blues · slow rock · soul',sub:'Desi soul on six strings — Indian blues and slow rock for the restless heart.',pill:'🎸 Feel it deep',image:'assets/highway-raat.png',playlist:'PLbc4BPciH8woKtyHVJxw5Q43DoNXPPrD9',accent:'#60a5fa',rgb:'96,165,250'},
  ghar:{label:'Ghar Ka Kaam',icon:'🧹',title:'Ghar Ka <em>Kaam</em>',kicker:'soft hindi · morning · kitchen vibes',sub:'"Amma bol rahi hai jaldi bartan dho…" — soft songs for small rituals.',pill:'🫧 Chore day comfort',image:'assets/bartan-time.png',playlist:'PLu68WmjcN84u34ZYc4aXZ55ZzSzVUyM5N',accent:'#ff7e9a',rgb:'255,126,154'}
};

// Playlist video IDs — fetched once per theme, shuffled client-side
const PLAYLIST_CACHE = {};

const $ = id => document.getElementById(id);
let active = 'corporate', started = false, toastTimer, searchTimer;
let pendingSong = null, editingPlId = null;
// Playback state
let queue = [], queueIdx = 0, currentVideoId = null;

// ── Web Audio API chain ───────────────────────────────────────
// audio → source → compressor → highShelf(air) → lowShelf(warmth) → gainNode → destination
let audioCtx = null, gainNode = null, sourceNode = null;
const audio = $('hq-audio');

function initAudioContext() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'playback' });
  sourceNode = audioCtx.createMediaElementSource(audio);

  // Dynamics compressor — prevents clipping, evens out loud/quiet passages
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 12;
  comp.ratio.value = 3;
  comp.attack.value = 0.003;
  comp.release.value = 0.18;

  // High shelf +2.5dB at 10kHz — restores "air" lost in compression
  const highShelf = audioCtx.createBiquadFilter();
  highShelf.type = 'highshelf';
  highShelf.frequency.value = 10000;
  highShelf.gain.value = 2.5;

  // Low shelf +2dB at 120Hz — warmth/body for vocals and instruments
  const lowShelf = audioCtx.createBiquadFilter();
  lowShelf.type = 'lowshelf';
  lowShelf.frequency.value = 120;
  lowShelf.gain.value = 2.0;

  // Master gain
  gainNode = audioCtx.createGain();
  const v = +localStorage.getItem('mehfil-vol');
  gainNode.gain.value = (Number.isFinite(v) && v >= 0 ? v : 80) / 100;

  sourceNode.connect(comp);
  comp.connect(highShelf);
  highShelf.connect(lowShelf);
  lowShelf.connect(gainNode);
  gainNode.connect(audioCtx.destination);
}

// ── Persistence ───────────────────────────────────────────────
function loadPlaylists() {
  try { return JSON.parse(localStorage.getItem('mehfil-playlists')) || []; } catch(e) { return []; }
}
function savePlaylists(pls) {
  try { localStorage.setItem('mehfil-playlists', JSON.stringify(pls)); } catch(e) {}
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3000);
}

// ── Player UI ─────────────────────────────────────────────────
function setPlayUI(playing) {
  $('play-icon').innerHTML = playing ? '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('btn-play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('disc').classList.toggle('spinning', playing);
  $('dot').classList.toggle('off', !playing);
  $('status').textContent = playing ? 'Playing' : 'Paused';
}
function setStatus(msg) { $('status').textContent = msg; }

// ── Theme menu ────────────────────────────────────────────────
function buildMenu() {
  for (const [k, t] of Object.entries(THEMES)) {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'menuitem'; b.dataset.theme = k;
    b.innerHTML = t.icon + ' ' + t.label;
    b.onclick = () => choose(k);
    $('menu').append(b);
  }
}

function choose(k) {
  const t = THEMES[k]; active = k;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--rgb', t.rgb);
  document.querySelector('meta[name=theme-color]').content = t.accent;
  $('selected').textContent = t.label;
  $('title').innerHTML = t.title;
  $('kicker').textContent = t.kicker;
  $('subtitle').textContent = t.sub;
  $('pill').textContent = t.pill;
  $('channel').textContent = t.label;
  document.querySelectorAll('[data-theme]').forEach(x => x.setAttribute('aria-current', String(x.dataset.theme === k)));
  $('menu').classList.remove('open');
  $('toggle').setAttribute('aria-expanded', 'false');
  $('next-scene').style.backgroundImage = 'url(' + t.image + ')';
  $('next-scene').classList.remove('next');
  setTimeout(() => { $('scene').style.backgroundImage = 'url(' + t.image + ')'; $('next-scene').classList.add('next'); }, 710);
  try { localStorage.setItem('mehfil-theme', k); } catch(e) {}
  if (started) loadThemePlaylist();
}

// ── Fetch playlist video IDs via Invidious ────────────────────
async function fetchPlaylistIds(playlistId) {
  if (PLAYLIST_CACHE[playlistId]) return PLAYLIST_CACHE[playlistId];
  for (const host of INVIDIOUS) {
    try {
      const res = await fetch(host + '/api/v1/playlists/' + playlistId + '?fields=videos');
      if (!res.ok) continue;
      const data = await res.json();
      const ids = (data.videos || []).map(v => ({ videoId: v.videoId, title: v.title, author: v.author }));
      if (ids.length) { PLAYLIST_CACHE[playlistId] = ids; return ids; }
    } catch(e) {}
  }
  return [];
}

// ── Core: fetch highest-quality stream URL via Netlify function
async function fetchStreamUrl(videoId) {
  const res = await fetch('/.netlify/functions/stream?id=' + videoId);
  if (!res.ok) throw new Error('stream fetch failed');
  return res.json(); // { url, codec, bitrate, title, author }
}

// ── Play a video by ID through HTML5 audio + Web Audio chain ──
async function playVideoById(videoId, title, artist) {
  if (!started) { started = true; $('start').classList.add('gone'); }
  initAudioContext();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  currentVideoId = videoId;
  $('track').textContent = title || 'Loading…';
  $('channel').textContent = artist || '';
  setStatus('Fetching stream…');
  audio.pause();
  try {
    const stream = await fetchStreamUrl(videoId);
    if (currentVideoId !== videoId) return; // superseded
    audio.src = stream.url;
    audio.load();
    await audio.play();
    if (stream.title) {
      $('track').textContent = stream.title;
      $('channel').textContent = stream.author || artist || '';
    }
    if ('mediaSession' in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({ title: stream.title || title || '', artist: stream.author || artist || '', album: 'Mehfil FM' });
  } catch(err) {
    if (currentVideoId !== videoId) return;
    toast('Skipping unavailable track…');
    playNext();
  }
}

function playNext() {
  if (!queue.length) return;
  queueIdx = (queueIdx + 1) % queue.length;
  const v = queue[queueIdx];
  playVideoById(v.videoId, v.title, v.author);
}
function playPrev() {
  if (!queue.length) return;
  queueIdx = (queueIdx - 1 + queue.length) % queue.length;
  const v = queue[queueIdx];
  playVideoById(v.videoId, v.title, v.author);
}

async function loadThemePlaylist() {
  setStatus('Loading playlist…');
  $('track').textContent = 'Loading ' + THEMES[active].label + '…';
  $('channel').textContent = THEMES[active].label;
  const ids = await fetchPlaylistIds(THEMES[active].playlist);
  if (!ids.length) { setStatus('Playlist unavailable'); return; }
  // Fisher-Yates shuffle
  queue = [...ids];
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  queueIdx = 0;
  playVideoById(queue[0].videoId, queue[0].title, queue[0].author);
}

// ── Audio element events ──────────────────────────────────────
audio.addEventListener('playing', () => setPlayUI(true));
audio.addEventListener('pause', () => setPlayUI(false));
audio.addEventListener('waiting', () => setStatus('Buffering…'));
audio.addEventListener('canplay', () => { if (!audio.paused) setStatus('Playing'); });
audio.addEventListener('ended', playNext);
audio.addEventListener('error', () => { toast('Skipping unavailable track…'); playNext(); });

function startPlayback() {
  started = true;
  $('start').classList.add('gone');
  loadThemePlaylist();
}

// ── Player controls ───────────────────────────────────────────
$('start-btn').onclick = startPlayback;
$('btn-play').onclick = () => {
  if (!started) return startPlayback();
  initAudioContext();
  if (audioCtx.state === 'suspended') { audioCtx.resume(); audio.play(); return; }
  if (audio.paused) audio.play();
  else audio.pause();
};
$('btn-next').onclick = () => { if (!started) return startPlayback(); playNext(); };
$('btn-prev').onclick = () => { if (!started) return startPlayback(); playPrev(); };
$('vol').oninput = () => {
  const v = +$('vol').value;
  if (gainNode) gainNode.gain.value = v / 100;
  try { localStorage.setItem('mehfil-vol', v); } catch(e) {}
};
$('toggle').onclick = () => { $('menu').classList.toggle('open'); $('toggle').setAttribute('aria-expanded', $('menu').classList.contains('open')); };
document.addEventListener('click', e => {
  if (!$('toggle').contains(e.target) && !$('menu').contains(e.target)) $('menu').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.target.matches('button,input,a')) return;
  if (e.code === 'Space') { e.preventDefault(); $('btn-play').click(); }
  if (e.key === 'ArrowRight') $('btn-next').click();
  if (e.key === 'ArrowLeft') $('btn-prev').click();
  const keys = Object.keys(THEMES);
  if (/^[1-6]$/.test(e.key)) choose(keys[+e.key - 1]);
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (audio.paused) audio.play(); });
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', playNext);
  navigator.mediaSession.setActionHandler('previoustrack', playPrev);
}

// ── Search ───────────────────────────────────────────────────
function showSearchState(state) {
  $('search-loading').classList.toggle('show', state === 'loading');
  $('search-results').classList.toggle('show', state === 'results');
  $('search-empty').classList.toggle('show', state === 'empty');
  $('suggestions-box').classList.toggle('show', state === 'suggest');
}

// Suggestions via Google autocomplete (no API key needed, uses firefox client for CORS)
async function fetchSuggestions(q) {
  if (!q.trim()) { showSearchState(''); return; }
  try {
    const res = await fetch('https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=' + encodeURIComponent(q));
    const data = await res.json();
    const suggestions = (data[1] || []).slice(0, 7);
    renderSuggestions(suggestions, q);
  } catch(e) {
    // suggestions failed silently, user can still press Enter to search
  }
}

function renderSuggestions(suggestions, q) {
  const box = $('suggestions-box');
  box.innerHTML = '';
  if (!suggestions.length) { showSearchState(''); return; }
  suggestions.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'suggest-item';
    // bold the matching part
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    btn.innerHTML = '🔍 ' + s.replace(new RegExp('(' + escaped + ')', 'i'), '<strong>$1</strong>');
    btn.onclick = () => {
      $('search-input').value = s;
      $('search-clear').classList.add('show');
      showSearchState('loading');
      doSearch(s);
    };
    box.append(btn);
  });
  showSearchState('suggest');
}

// Full search via Invidious API (free, no key, real YouTube data)
async function doSearch(q) {
  if (!q.trim()) { showSearchState(''); return; }
  showSearchState('loading');
  $('suggestions-box').classList.remove('show');
  let lastErr = null;
  for (const host of INVIDIOUS) {
    try {
      const url = host + '/api/v1/search?q=' + encodeURIComponent(q) + '&type=video&fields=videoId,title,author,lengthSeconds,videoThumbnails&page=1';
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) { showSearchState('empty'); return; }
      renderResults(data.slice(0, 10));
      showSearchState('results');
      return;
    } catch(e) { lastErr = e; }
  }
  $('search-empty').textContent = 'Search failed. Check your connection and try again.';
  showSearchState('empty');
}

function renderResults(videos) {
  const container = $('search-results');
  container.innerHTML = '';
  videos.forEach(v => {
    const vid = v.videoId;
    const title = v.title || 'Unknown';
    const artist = v.author || '';
    // always use YouTube CDN for thumbnails — never Invidious server URLs
    const thumb = 'https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg';
    const duration = v.lengthSeconds ? Math.floor(v.lengthSeconds/60) + ':' + String(v.lengthSeconds%60).padStart(2,'0') : '';
    const song = { videoId: vid, title, artist, thumb };

    const div = document.createElement('div');
    div.className = 'sr-item';

    const titleEl = document.createElement('div');
    titleEl.className = 'sr-title';
    titleEl.textContent = title;

    const subEl = document.createElement('div');
    subEl.className = 'sr-sub';
    subEl.textContent = artist + (duration ? ' · ' + duration : '');

    const img = document.createElement('img');
    img.className = 'sr-thumb';
    img.src = thumb;
    img.alt = '';
    img.loading = 'lazy';

    const meta = document.createElement('div');
    meta.className = 'sr-meta';
    meta.append(titleEl, subEl);

    const playBtn = document.createElement('button');
    playBtn.className = 'sr-btn';
    playBtn.title = 'Play';
    playBtn.setAttribute('aria-label', 'Play ' + title);
    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

    const addBtn = document.createElement('button');
    addBtn.className = 'sr-btn';
    addBtn.title = 'Add to playlist';
    addBtn.setAttribute('aria-label', 'Add to playlist');
    addBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M17 14v6m-3-3h6" stroke="currentColor" stroke-width="2" fill="none"/></svg>';

    const actions = document.createElement('div');
    actions.className = 'sr-actions';
    actions.append(playBtn, addBtn);

    div.append(img, meta, actions);

    playBtn.onclick = (e) => { e.stopPropagation(); playVideoById(vid, title, artist); };
    addBtn.onclick = (e) => { e.stopPropagation(); openAddToPlaylist(song); };
    div.onclick = () => playVideoById(vid, title, artist);

    container.append(div);
  });
}

$('search-input').addEventListener('input', () => {
  const q = $('search-input').value;
  $('search-clear').classList.toggle('show', q.length > 0);
  clearTimeout(searchTimer);
  if (!q.trim()) { showSearchState(''); return; }
  // show suggestions after 300ms, full search on Enter
  searchTimer = setTimeout(() => fetchSuggestions(q), 300);
});

$('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(searchTimer);
    showSearchState('loading');
    doSearch($('search-input').value);
  }
  if (e.key === 'Escape') {
    $('search-input').value = '';
    $('search-clear').classList.remove('show');
    showSearchState('');
  }
});

$('search-clear').onclick = () => {
  $('search-input').value = '';
  $('search-clear').classList.remove('show');
  showSearchState('');
};

// close suggestions when clicking outside
document.addEventListener('click', e => {
  if (!$('search-input').contains(e.target) && !$('suggestions-box').contains(e.target))
    $('suggestions-box').classList.remove('show');
});

// ── Playlist panel ───────────────────────────────────────────
$('pl-open-btn').onclick = () => { $('pl-panel').classList.add('open'); renderPlaylists(); };
$('pl-close').onclick = () => $('pl-panel').classList.remove('open');

$('pl-new-btn').onclick = () => {
  editingPlId = null;
  $('pl-name-input').value = '';
  $('pl-desc-input').value = '';
  $('pl-form').classList.add('show');
  $('pl-name-input').focus();
};
$('pl-form-cancel').onclick = () => $('pl-form').classList.remove('show');
$('pl-form-save').onclick = () => {
  const name = $('pl-name-input').value.trim();
  if (!name) { toast('Enter a playlist name'); return; }
  const pls = loadPlaylists();
  if (editingPlId) {
    const pl = pls.find(p => p.id === editingPlId);
    if (pl) { pl.name = name; pl.desc = $('pl-desc-input').value.trim(); }
    toast('Playlist renamed');
  } else {
    pls.push({ id: Date.now().toString(), name, desc: $('pl-desc-input').value.trim(), songs: [] });
    toast('Playlist created');
  }
  savePlaylists(pls);
  $('pl-form').classList.remove('show');
  editingPlId = null;
  renderPlaylists();
};

function renderPlaylists() {
  const pls = loadPlaylists();
  const container = $('pl-list');
  container.innerHTML = '';
  if (pls.length === 0) {
    container.innerHTML = '<div class="pl-empty">No playlists yet. Create one!</div>';
    return;
  }
  pls.forEach(pl => {
    const card = document.createElement('div');
    card.className = 'pl-card';
    card.innerHTML = `
      <div class="pl-card-head">
        <div>
          <div class="pl-name">${pl.name}</div>
          <div class="pl-count">${pl.songs.length} song${pl.songs.length !== 1 ? 's' : ''}${pl.desc ? ' · ' + pl.desc : ''}</div>
        </div>
        <div class="pl-card-actions">
          <button class="pl-action" data-rename="${pl.id}">Rename</button>
          <button class="pl-action" data-delete="${pl.id}">Delete</button>
        </div>
      </div>
      <div class="pl-songs" id="pl-songs-${pl.id}">
        ${pl.songs.length === 0 ? '<div class="pl-empty">No songs yet.</div>' : ''}
        ${pl.songs.map((s, i) => `
          <div class="pl-song">
            <img class="pl-song-thumb" src="${s.thumb}" alt="" loading="lazy">
            <div>
              <div class="pl-song-title">${s.title}</div>
              <div class="pl-song-artist">${s.artist}</div>
            </div>
            <div style="display:flex;gap:4px">
              <button class="pl-action" data-play-song="${pl.id}" data-idx="${i}" title="Play">▶</button>
              <button class="pl-song-del" data-del-song="${pl.id}" data-idx="${i}" title="Remove">✕</button>
            </div>
          </div>`).join('')}
        ${pl.songs.length > 0 ? `<button class="pl-play-all" data-play-all="${pl.id}">▶ Play all</button>` : ''}
      </div>`;

    // toggle expand
    card.querySelector('.pl-card-head').onclick = (e) => {
      if (e.target.closest('[data-rename],[data-delete]')) return;
      card.querySelector('.pl-songs').classList.toggle('open');
    };

    // rename
    card.querySelector('[data-rename]').onclick = () => {
      editingPlId = pl.id;
      $('pl-name-input').value = pl.name;
      $('pl-desc-input').value = pl.desc || '';
      $('pl-form').classList.add('show');
      $('pl-name-input').focus();
    };

    // delete
    card.querySelector('[data-delete]').onclick = () => {
      if (!confirm('Delete playlist "' + pl.name + '"?')) return;
      const pls2 = loadPlaylists().filter(p => p.id !== pl.id);
      savePlaylists(pls2);
      toast('Playlist deleted');
      renderPlaylists();
    };

    // play individual song
    card.querySelectorAll('[data-play-song]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const pls2 = loadPlaylists();
        const pl2 = pls2.find(p => p.id === btn.dataset.playSong);
        const song = pl2 && pl2.songs[+btn.dataset.idx];
        if (song) playVideoById(song.videoId, song.title, song.artist);
      };
    });

    // remove song
    card.querySelectorAll('[data-del-song]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const pls2 = loadPlaylists();
        const pl2 = pls2.find(p => p.id === btn.dataset.delSong);
        if (pl2) { pl2.songs.splice(+btn.dataset.idx, 1); savePlaylists(pls2); toast('Song removed'); renderPlaylists(); }
      };
    });

    // play all
    const playAllBtn = card.querySelector('[data-play-all]');
    if (playAllBtn) {
      playAllBtn.onclick = (e) => {
        e.stopPropagation();
        const pls2 = loadPlaylists();
        const pl2 = pls2.find(p => p.id === playAllBtn.dataset.playAll);
        if (pl2 && pl2.songs.length > 0) playVideoById(pl2.songs[0].videoId, pl2.songs[0].title, pl2.songs[0].artist);
      };
    }

    container.append(card);
  });
}

// ── Add to playlist modal ────────────────────────────────────
function openAddToPlaylist(song) {
  pendingSong = song;
  const pls = loadPlaylists();
  const list = $('modal-pl-list');
  list.innerHTML = '';
  if (pls.length === 0) {
    list.innerHTML = '<div style="color:#a08878;font-size:.8rem;margin-bottom:10px">No playlists yet.</div>';
  } else {
    pls.forEach(pl => {
      const btn = document.createElement('button');
      btn.className = 'modal-pl-item';
      const already = pl.songs.some(s => s.videoId === song.videoId);
      btn.innerHTML = `<span>${pl.name}</span><span style="color:#a08878;font-size:.72rem">${pl.songs.length} songs${already ? ' · already added' : ''}</span>`;
      btn.disabled = already;
      if (already) btn.style.opacity = '0.5';
      btn.onclick = () => addSongToPlaylist(pl.id, song);
      list.append(btn);
    });
  }
  $('modal-bg').classList.add('show');
}

function addSongToPlaylist(plId, song) {
  const pls = loadPlaylists();
  const pl = pls.find(p => p.id === plId);
  if (!pl) return;
  if (pl.songs.some(s => s.videoId === song.videoId)) { toast('Already in this playlist'); return; }
  pl.songs.push(song);
  savePlaylists(pls);
  $('modal-bg').classList.remove('show');
  toast('Added to "' + pl.name + '"');
  renderPlaylists();
}

$('modal-cancel').onclick = () => { $('modal-bg').classList.remove('show'); pendingSong = null; };
$('modal-bg').onclick = (e) => { if (e.target === $('modal-bg')) { $('modal-bg').classList.remove('show'); pendingSong = null; } };
$('modal-new-pl').onclick = () => {
  $('modal-bg').classList.remove('show');
  $('pl-panel').classList.add('open');
  editingPlId = null;
  $('pl-name-input').value = '';
  $('pl-desc-input').value = '';
  $('pl-form').classList.add('show');
  $('pl-name-input').focus();
  // after save, add pending song automatically
  const origSave = $('pl-form-save').onclick;
  $('pl-form-save').onclick = () => {
    const name = $('pl-name-input').value.trim();
    if (!name) { toast('Enter a playlist name'); return; }
    const pls = loadPlaylists();
    const newPl = { id: Date.now().toString(), name, desc: $('pl-desc-input').value.trim(), songs: [] };
    if (pendingSong) newPl.songs.push(pendingSong);
    pls.push(newPl);
    savePlaylists(pls);
    toast(pendingSong ? 'Playlist created & song added' : 'Playlist created');
    pendingSong = null;
    $('pl-form').classList.remove('show');
    $('pl-form-save').onclick = origSave;
    renderPlaylists();
  };
};

// ── Init ─────────────────────────────────────────────────────
buildMenu();
try { active = localStorage.getItem('mehfil-theme') || active; } catch(e) {}
// restore volume slider
try { const v = +localStorage.getItem('mehfil-vol'); if (Number.isFinite(v) && v >= 0) $('vol').value = v; } catch(e) {}
choose(THEMES[active] ? active : 'corporate');
</script>
