<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mehfil FM — ad-free Indian radio for every mood.">
<meta name="theme-color" content="#ffb35d">
<title>Mehfil FM — Indian Radio</title>
<style>
:root{--accent:#ffb35d;--rgb:255,179,93;--text:#fff8ed;--panel:rgba(18,11,7,.82);--line:rgba(255,248,230,.27)}
*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}
body{background:#120a06;color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.scene,.veil{position:fixed;inset:0}
.scene{background:#1b1008 center/cover no-repeat;transition:opacity .7s,transform 1s;transform:scale(1.025)}
.scene.next{opacity:0;transform:scale(1.07)}
.veil{pointer-events:none;background:linear-gradient(180deg,#0007 0%,#0002 40%,#000c 100%)}

.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100svh;padding:22px max(20px,calc((100vw - 1220px)/2));text-shadow:0 2px 14px #0008}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;gap:9px;align-items:center;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:#35dfab;box-shadow:0 0 12px #35dfab;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #35dfab}50%{box-shadow:0 0 22px #35dfab,0 0 40px #35dfab44}}

.theme-select{position:relative}
.theme-toggle,.about{border:1px solid var(--line);border-radius:999px;color:var(--text);background:#130c09a8;backdrop-filter:blur(10px)}
.theme-toggle{min-width:210px;padding:10px 19px;font-size:.8rem;font-weight:800}
.menu{position:absolute;top:calc(100% + 9px);left:50%;display:none;width:250px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#160d0bef;box-shadow:0 18px 40px #0009;transform:translateX(-50%);z-index:10}
.menu.open{display:block}
.menu button{width:100%;padding:11px 15px;border:0;color:var(--text);background:transparent;text-align:left;display:flex;align-items:center;gap:10px}
.menu button:hover,.menu button[aria-current=true]{background:rgba(var(--rgb),.23)}
.about{justify-self:end;padding:9px 15px;color:var(--text);text-decoration:none;font-size:.8rem}

.hero{display:grid;flex:1;place-content:center;justify-items:center;min-height:540px;padding:38px 0 72px;text-align:center}
.kicker{margin:0 0 12px;color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
.title{max-width:900px;margin:0;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(3rem,8.6vw,7.5rem);line-height:.9;letter-spacing:-.06em}
.title em{font-weight:400}
.subtitle{max-width:560px;margin:17px auto;color:#f2dfcb;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(.95rem,2vw,1.15rem);font-style:italic}
.pill{margin:5px 0 18px;padding:8px 17px;border:1px solid rgba(var(--rgb),.6);border-radius:999px;color:var(--accent);background:#130a08a6;font-size:.8rem;font-weight:800}

.player-wrap{width:min(100%,640px)}

/* YouTube iframe sits here, visible and interactive */
.yt-frame-wrap{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 65px #000a}
.yt-frame-wrap iframe{display:block;width:100%;height:360px;border:0}

.info-bar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(18px);font-size:.75rem;color:#ead8c8b3}
.info-bar .station{font-weight:800;color:var(--text);font-size:.82rem}

.toast{position:fixed;z-index:4;bottom:20px;left:50%;max-width:calc(100% - 40px);padding:10px 16px;border-radius:10px;background:#21130c;box-shadow:0 10px 30px #0009;transform:translate(-50%,180%);transition:transform .25s;font-size:.82rem}
.toast.show{transform:translate(-50%,0)}

.start{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:20px;background:#10080460;backdrop-filter:blur(10px);transition:opacity .4s,visibility .4s}
.start.gone{visibility:hidden;opacity:0}
.start button{padding:22px 32px;border:1px solid #fff8;border-radius:20px;color:#fff;background:#120b09e0;box-shadow:0 18px 50px #000a}
.start strong{display:block;font-size:1.2rem}
.start span{display:block;margin-top:6px;color:#e7d5c6;font-size:.84rem}

@media(max-width:620px){
  .app{padding:15px}
  .brand span,.about{display:none}
  header{grid-template-columns:1fr auto}
  .theme-toggle{min-width:160px;padding:9px 13px}
  .hero{min-height:unset;padding:30px 0 40px}
  .title{font-size:clamp(2.5rem,14vw,4rem)}
  .yt-frame-wrap iframe{height:220px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>

<div class="scene" id="scene"></div>
<div class="scene next" id="next-scene"></div>
<div class="veil"></div>

<main class="app">
  <header>
    <div class="brand"><i></i><span>Mehfil FM</span></div>
    <div class="theme-select">
      <button class="theme-toggle" id="toggle" aria-expanded="false">
        Change theme &middot; <span id="selected">Corporate Majdoor</span>
      </button>
      <div class="menu" id="menu" role="menu"></div>
    </div>
    <a class="about" href="#" rel="noopener">About</a>
  </header>

  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="pill" id="pill"></div>

    <div class="player-wrap">
      <div class="yt-frame-wrap">
        <iframe
          id="yt-iframe"
          src=""
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
          title="Mehfil FM Player">
        </iframe>
      </div>
      <div class="info-bar">
        <span class="station" id="station-name">Corporate Majdoor</span>
        <span>Ad-free &middot; YouTube Music &middot; Use player controls above</span>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="start" id="start">
  <button id="start-btn">
    <strong>&#9654; Enter Mehfil FM</strong>
    <span>Ad-free Indian music for every mood</span>
  </button>
</div>

<script>
const THEMES = {
  corporate: {
    label: 'Corporate Majdoor',
    icon: '&#128188;',
    title: 'Corporate <em>Majdoor</em>',
    kicker: '9 to 5 &middot; lofi focus beats',
    sub: '&ldquo;Chai pe chalte hain?&rdquo; &mdash; lofi bollywood to survive every deadline.',
    pill: '&#9749; Focus mode on',
    image: 'assets/corporate-sunset.png',
    playlist: 'PLqn8TmQNZp5owBysoqordPjLha-q7SJmI',
    accent: '#ffb35d', rgb: '255,179,93'
  },
  highway: {
    label: 'Highway Raat',
    icon: '&#128652;',
    title: 'Highway <em>Raat</em>',
    kicker: 'NH 48 &middot; desi road trip',
    sub: 'Headlights, dhaba chai, and Hindi songs that feel like home on a long road.',
    pill: '&#128652; Horn OK please',
    image: 'assets/highway-raat.png',
    playlist: 'PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy',
    accent: '#f6a32f', rgb: '246,163,47'
  },
  nai: {
    label: 'Nai Ki Dukaan',
    icon: '&#9986;',
    title: 'Nai Ki <em>Dukaan</em>',
    kicker: 'golden era &middot; purani yaadein',
    sub: 'Kishore, Rafi, Lata &mdash; the classics that play on every barbershop radio.',
    pill: '&#9986;&#65039; Ek number cut',
    image: 'assets/mela-beats.png',
    playlist: 'PLT0TCjjVVGLSI0kKaqkatnFsWZv9RrPJh',
    accent: '#ffd04e', rgb: '255,208,78'
  },
  jazz: {
    label: 'Jazz Adda',
    icon: '&#127927;',
    title: 'Jazz <em>Adda</em>',
    kicker: 'indian jazz &middot; fusion &middot; instrumental',
    sub: 'Where the sitar meets the saxophone &mdash; late night Indian jazz and fusion.',
    pill: '&#127927; Smooth vibes only',
    image: 'assets/corporate-sunset.png',
    playlist: 'PLR5auAn2jtXdjSozf_pJN899DtvOY5-Xi',
    accent: '#a78bfa', rgb: '167,139,250'
  },
  blues: {
    label: 'Blues Gali',
    icon: '&#127928;',
    title: 'Blues <em>Gali</em>',
    kicker: 'indian blues &middot; slow rock &middot; soul',
    sub: 'Desi soul on six strings &mdash; Indian blues and slow rock for the restless heart.',
    pill: '&#127928; Feel it deep',
    image: 'assets/highway-raat.png',
    playlist: 'PLbc4BPciH8woKtyHVJxw5Q43DoNXPPrD9',
    accent: '#60a5fa', rgb: '96,165,250'
  },
  ghar: {
    label: 'Ghar Ka Kaam',
    icon: '&#129529;',
    title: 'Ghar Ka <em>Kaam</em>',
    kicker: 'soft hindi &middot; morning &middot; kitchen vibes',
    sub: '&ldquo;Amma bol rahi hai jaldi bartan dho&hellip;&rdquo; &mdash; soft songs for small rituals.',
    pill: '&#129529; Chore day comfort',
    image: 'assets/bartan-time.png',
    playlist: 'PLu68WmjcN84u34ZYc4aXZ55ZzSzVUyM5N',
    accent: '#ff7e9a', rgb: '255,126,154'
  }
};

const $ = id => document.getElementById(id);
let active = 'corporate', started = false, toastTimer;

function buildMenu() {
  for (const [k, t] of Object.entries(THEMES)) {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'menuitem';
    b.dataset.theme = k;
    b.innerHTML = '<span>' + t.icon + '</span>' + t.label;
    b.onclick = () => choose(k);
    $('menu').append(b);
  }
}

function embedURL(playlistId, autoplay) {
  return 'https://www.youtube.com/embed/videoseries?list=' + playlistId
    + '&autoplay=' + (autoplay ? 1 : 0)
    + '&rel=0&modestbranding=1&playsinline=1';
}

function choose(k) {
  const t = THEMES[k]; active = k;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--rgb', t.rgb);
  document.querySelector('meta[name=theme-color]').content = t.accent;
  $('selected').textContent = t.label;
  $('station-name').textContent = t.label;
  $('title').innerHTML = t.title;
  $('kicker').innerHTML = t.kicker;
  $('subtitle').innerHTML = t.sub;
  $('pill').innerHTML = t.pill;
  document.querySelectorAll('[data-theme]').forEach(x =>
    x.setAttribute('aria-current', String(x.dataset.theme === k))
  );
  $('menu').classList.remove('open');
  $('toggle').setAttribute('aria-expanded', 'false');
  $('next-scene').style.backgroundImage = 'url(' + t.image + ')';
  $('next-scene').classList.remove('next');
  setTimeout(() => {
    $('scene').style.backgroundImage = 'url(' + t.image + ')';
    $('next-scene').classList.add('next');
  }, 710);
  try { localStorage.setItem('mehfil-theme', k); } catch(e) {}
  if (started) $('yt-iframe').src = embedURL(t.playlist, true);
}

function start() {
  started = true;
  $('start').classList.add('gone');
  $('yt-iframe').src = embedURL(THEMES[active].playlist, true);
}

buildMenu();
try { active = localStorage.getItem('mehfil-theme') || active; } catch(e) {}
choose(THEMES[active] ? active : 'corporate');

$('start-btn').onclick = start;

$('toggle').onclick = () => {
  $('menu').classList.toggle('open');
  $('toggle').setAttribute('aria-expanded', $('menu').classList.contains('open'));
};
document.addEventListener('click', e => {
  if (!$('toggle').contains(e.target) && !$('menu').contains(e.target))
    $('menu').classList.remove('open');
});

document.addEventListener('keydown', e => {
  if (e.target.matches('button,input,a,iframe')) return;
  const keys = Object.keys(THEMES);
  if (/^[1-6]$/.test(e.key)) choose(keys[+e.key - 1]);
});
</script>
</body>
</html>
