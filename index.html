<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mehfil FM — ad-free Indian radio for every mood.">
<meta name="theme-color" content="#ffb35d">
<title>Mehfil FM — Indian Radio</title>
<style>
:root{--accent:#ffb35d;--rgb:255,179,93;--text:#fff8ed;--panel:rgba(18,11,7,.82);--line:rgba(255,248,230,.27)}
*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}
body{background:#120a06;color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.scene,.veil{position:fixed;inset:0}
.scene{background:#1b1008 center/cover no-repeat;transition:opacity .7s,transform 1s;transform:scale(1.025)}
.scene.next{opacity:0;transform:scale(1.07)}
.veil{pointer-events:none;background:linear-gradient(180deg,#0007 0%,#0002 40%,#000c 100%)}

.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100svh;padding:22px max(20px,calc((100vw - 1220px)/2));text-shadow:0 2px 14px #0008}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.brand{display:flex;gap:9px;align-items:center;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:#35dfab;box-shadow:0 0 12px #35dfab;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #35dfab}50%{box-shadow:0 0 22px #35dfab,0 0 40px #35dfab44}}
.theme-select{position:relative}
.theme-toggle,.about{border:1px solid var(--line);border-radius:999px;color:var(--text);background:#130c09a8;backdrop-filter:blur(10px)}
.theme-toggle{min-width:210px;padding:10px 19px;font-size:.8rem;font-weight:800}
.menu{position:absolute;top:calc(100% + 9px);left:50%;display:none;width:250px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#160d0bef;box-shadow:0 18px 40px #0009;transform:translateX(-50%);z-index:10}
.menu.open{display:block}
.menu button{width:100%;padding:11px 15px;border:0;color:var(--text);background:transparent;text-align:left;display:flex;align-items:center;gap:10px;font-size:.88rem}
.menu button:hover,.menu button[aria-current=true]{background:rgba(var(--rgb),.23)}
.about{justify-self:end;padding:9px 15px;color:var(--text);text-decoration:none;font-size:.8rem}

.hero{display:grid;flex:1;place-content:center;justify-items:center;min-height:540px;padding:38px 0 72px;text-align:center}
.kicker{margin:0 0 12px;color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
.title{max-width:900px;margin:0;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(3rem,8.6vw,7.5rem);line-height:.9;letter-spacing:-.06em}
.title em{font-weight:400}
.subtitle{max-width:560px;margin:17px auto;color:#f2dfcb;font-family:Georgia,"Noto Serif Devanagari",serif;font-size:clamp(.95rem,2vw,1.15rem);font-style:italic}
.pill{margin:5px 0 18px;padding:8px 17px;border:1px solid rgba(var(--rgb),.6);border-radius:999px;color:var(--accent);background:#130a08a6;font-size:.8rem;font-weight:800}

.player{width:min(100%,580px);padding:16px 18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 65px #000a;backdrop-filter:blur(18px);text-align:left}
.top{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center}
.disc{display:grid;place-items:center;width:52px;height:52px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);background:radial-gradient(circle,rgba(var(--rgb),.5) 0 12%,#130c09 14% 48%,rgba(var(--rgb),.35) 50% 52%,#130c09 54%);flex-shrink:0;transition:border-color .3s}
.disc svg{width:20px}
.disc.spinning{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta p{overflow:hidden;margin:0;text-overflow:ellipsis;white-space:nowrap}
.track{font-size:.88rem;font-weight:800}
.channel{margin-top:3px;color:#e7d6c6;font-size:.72rem}
.status{margin-top:4px;display:flex;align-items:center;gap:6px;font-size:.68rem;color:#decbbb}
.dot{width:6px;height:6px;border-radius:50%;background:#35dfab;box-shadow:0 0 6px #35dfab;flex-shrink:0}
.dot.off{background:#555;box-shadow:none}

.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.icon{display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:50%;color:var(--text);background:#fff1;transition:background .15s}
.icon:hover{background:#fff3}
.icon svg{width:17px;fill:currentColor}
.play{width:52px;height:52px;border-color:var(--accent);color:#1c1008;background:var(--accent)}
.play:hover{filter:brightness(1.1)}

.vol-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.vol-row input{flex:1;height:4px;accent-color:var(--accent);cursor:pointer}
.vol-row svg{width:16px;fill:var(--text);flex-shrink:0;opacity:.7}

.toast{position:fixed;z-index:4;bottom:20px;left:50%;max-width:calc(100% - 40px);padding:10px 16px;border-radius:10px;background:#21130c;box-shadow:0 10px 30px #0009;transform:translate(-50%,180%);transition:transform .25s;font-size:.82rem}
.toast.show{transform:translate(-50%,0)}

.start{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:20px;background:#10080460;backdrop-filter:blur(10px);transition:opacity .4s,visibility .4s}
.start.gone{visibility:hidden;opacity:0}
.start button{padding:22px 36px;border:1px solid #fff8;border-radius:20px;color:#fff;background:#120b09e0;box-shadow:0 18px 50px #000a}
.start strong{display:block;font-size:1.2rem}
.start span{display:block;margin-top:6px;color:#e7d5c6;font-size:.84rem}

/* YouTube iframe hidden off-screen but rendered so browser allows playback */
#yt-wrap{position:fixed;left:-9999px;top:-9999px;width:320px;height:180px;pointer-events:none}

@media(max-width:620px){
  .app{padding:15px}
  .brand span,.about{display:none}
  header{grid-template-columns:1fr auto}
  .theme-toggle{min-width:160px;padding:9px 13px}
  .hero{min-height:580px;padding-top:50px}
  .title{font-size:clamp(2.8rem,16vw,4.5rem)}
  .player{border-radius:18px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>

<div class="scene" id="scene"></div>
<div class="scene next" id="next-scene"></div>
<div class="veil"></div>

<main class="app">
  <header>
    <div class="brand"><i></i><span>Mehfil FM</span></div>
    <div class="theme-select">
      <button class="theme-toggle" id="toggle" aria-expanded="false">
        Change theme &middot; <span id="selected"></span>
      </button>
      <div class="menu" id="menu" role="menu"></div>
    </div>
    <a class="about" href="#" rel="noopener">About</a>
  </header>

  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="pill" id="pill"></div>

    <div class="player">
      <div class="top">
        <div class="disc" id="disc">
          <svg viewBox="0 0 24 24"><path d="M7 18V6l11-3v12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="18" r="3"/><circle cx="16" cy="15" r="3"/></svg>
        </div>
        <div class="meta">
          <p class="track" id="track">Tap play to start</p>
          <p class="channel" id="channel"></p>
          <div class="status">
            <span class="dot off" id="dot"></span>
            <span id="status">Ready</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="icon" id="btn-prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm12 0v14l-9-7z"/></svg>
        </button>
        <button class="icon play" id="btn-play" aria-label="Play">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon" id="btn-next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5v14l9-7z"/></svg>
        </button>
      </div>

      <div class="vol-row">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 15.5 12z"/></svg>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm11.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 15.5 12zM18.5 12a7 7 0 0 0-4-6.33v12.65A7 7 0 0 0 18.5 12z"/></svg>
      </div>
    </div>
  </section>
</main>

<!-- Hidden off-screen, rendered at real size so YouTube allows playback -->
<div id="yt-wrap"><div id="yt-player"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="start" id="start">
  <button id="start-btn">
    <strong>&#9654; Enter Mehfil FM</strong>
    <span>Ad-free Indian music for every mood</span>
  </button>
</div>

<script>
const THEMES = {
  corporate: {
    label: 'Corporate Majdoor', icon: '💼',
    title: 'Corporate <em>Majdoor</em>',
    kicker: '9 to 5 · lofi focus beats',
    sub: '"Chai pe chalte hain?" — lofi bollywood to survive every deadline.',
    pill: '☕ Focus mode on',
    image: 'assets/corporate-sunset.png',
    playlist: 'PLqn8TmQNZp5owBysoqordPjLha-q7SJmI',
    accent: '#ffb35d', rgb: '255,179,93'
  },
  highway: {
    label: 'Highway Raat', icon: '🚛',
    title: 'Highway <em>Raat</em>',
    kicker: 'NH 48 · desi road trip',
    sub: 'Headlights, dhaba chai, and Hindi songs that feel like home on a long road.',
    pill: '🚌 Horn OK please',
    image: 'assets/highway-raat.png',
    playlist: 'PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy',
    accent: '#f6a32f', rgb: '246,163,47'
  },
  nai: {
    label: 'Nai Ki Dukaan', icon: '✂️',
    title: 'Nai Ki <em>Dukaan</em>',
    kicker: 'golden era · purani yaadein',
    sub: 'Kishore, Rafi, Lata — the classics that play on every barbershop radio.',
    pill: '✂️ Ek number cut',
    image: 'assets/mela-beats.png',
    playlist: 'PLT0TCjjVVGLSI0kKaqkatnFsWZv9RrPJh',
    accent: '#ffd04e', rgb: '255,208,78'
  },
  jazz: {
    label: 'Jazz Adda', icon: '🎷',
    title: 'Jazz <em>Adda</em>',
    kicker: 'indian jazz · fusion · instrumental',
    sub: 'Where the sitar meets the saxophone — late night Indian jazz and fusion.',
    pill: '🎷 Smooth vibes only',
    image: 'assets/corporate-sunset.png',
    playlist: 'PLR5auAn2jtXdjSozf_pJN899DtvOY5-Xi',
    accent: '#a78bfa', rgb: '167,139,250'
  },
  blues: {
    label: 'Blues Gali', icon: '🎸',
    title: 'Blues <em>Gali</em>',
    kicker: 'indian blues · slow rock · soul',
    sub: 'Desi soul on six strings — Indian blues and slow rock for the restless heart.',
    pill: '🎸 Feel it deep',
    image: 'assets/highway-raat.png',
    playlist: 'PLbc4BPciH8woKtyHVJxw5Q43DoNXPPrD9',
    accent: '#60a5fa', rgb: '96,165,250'
  },
  ghar: {
    label: 'Ghar Ka Kaam', icon: '🧹',
    title: 'Ghar Ka <em>Kaam</em>',
    kicker: 'soft hindi · morning · kitchen vibes',
    sub: '"Amma bol rahi hai jaldi bartan dho…" — soft songs for small rituals.',
    pill: '🫧 Chore day comfort',
    image: 'assets/bartan-time.png',
    playlist: 'PLu68WmjcN84u34ZYc4aXZ55ZzSzVUyM5N',
    accent: '#ff7e9a', rgb: '255,126,154'
  }
};

const $ = id => document.getElementById(id);
let active = 'corporate', player, started = false, toastTimer;

// ── UI helpers ──────────────────────────────────────────────
function setPlayUI(playing) {
  $('play-icon').innerHTML = playing
    ? '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $('btn-play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('disc').classList.toggle('spinning', playing);
  $('dot').classList.toggle('off', !playing);
  $('status').textContent = playing ? 'Playing' : 'Paused';
}

function setStatus(msg) { $('status').textContent = msg; }

function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3000);
}

// ── Menu ────────────────────────────────────────────────────
function buildMenu() {
  for (const [k, t] of Object.entries(THEMES)) {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'menuitem'; b.dataset.theme = k;
    b.innerHTML = t.icon + ' ' + t.label;
    b.onclick = () => choose(k);
    $('menu').append(b);
  }
}

// ── Theme switch ────────────────────────────────────────────
function choose(k) {
  const t = THEMES[k]; active = k;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--rgb', t.rgb);
  document.querySelector('meta[name=theme-color]').content = t.accent;
  $('selected').textContent = t.label;
  $('title').innerHTML = t.title;
  $('kicker').textContent = t.kicker;
  $('subtitle').textContent = t.sub;
  $('pill').textContent = t.pill;
  $('channel').textContent = t.label;
  document.querySelectorAll('[data-theme]').forEach(x =>
    x.setAttribute('aria-current', String(x.dataset.theme === k))
  );
  $('menu').classList.remove('open');
  $('toggle').setAttribute('aria-expanded', 'false');
  $('next-scene').style.backgroundImage = 'url(' + t.image + ')';
  $('next-scene').classList.remove('next');
  setTimeout(() => {
    $('scene').style.backgroundImage = 'url(' + t.image + ')';
    $('next-scene').classList.add('next');
  }, 710);
  try { localStorage.setItem('mehfil-theme', k); } catch(e) {}
  if (started && player) loadPlaylist();
}

// ── YouTube ─────────────────────────────────────────────────
function loadPlaylist() {
  setStatus('Loading…');
  $('track').textContent = 'Loading ' + THEMES[active].label + '…';
  player.loadPlaylist({ listType: 'playlist', list: THEMES[active].playlist, index: 0 });
  // shuffle after playlist queues
  setTimeout(() => { try { player.setShuffle(true); player.setLoop(true); } catch(e) {} }, 2000);
}

window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('yt-player', {
    width: 320, height: 180,
    playerVars: {
      autoplay: 0, playsinline: 1, controls: 0,
      rel: 0, modestbranding: 1,
      origin: location.origin
    },
    events: {
      onReady() {
        try {
          const v = +localStorage.getItem('mehfil-vol');
          player.setVolume(Number.isFinite(v) && v >= 0 ? v : 80);
          $('vol').value = Number.isFinite(v) && v >= 0 ? v : 80;
        } catch(e) {}
        if (started) loadPlaylist();
      },
      onStateChange(e) {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) {
          setPlayUI(true);
          try {
            const d = player.getVideoData();
            if (d && d.title) {
              $('track').textContent = d.title;
              if ('mediaSession' in navigator)
                navigator.mediaSession.metadata = new MediaMetadata({
                  title: d.title, artist: d.author || '', album: 'Mehfil FM'
                });
            }
          } catch(err) {}
        } else if (e.data === S.PAUSED) {
          setPlayUI(false);
        } else if (e.data === S.BUFFERING) {
          setStatus('Buffering…');
        } else if (e.data === S.ENDED) {
          player.nextVideo();
        }
      },
      onError(e) {
        // 101/150 = embed not allowed for this video, skip it
        toast('Skipping unavailable track…');
        setTimeout(() => { try { player.nextVideo(); } catch(err) {} }, 1000);
      }
    }
  });
};

// Load YouTube API script
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.append(s);

// ── Start ───────────────────────────────────────────────────
function startPlayback() {
  started = true;
  $('start').classList.add('gone');
  if (player) loadPlaylist();
  else setStatus('Connecting…');
}

// ── Controls ────────────────────────────────────────────────
$('start-btn').onclick = startPlayback;

$('btn-play').onclick = () => {
  if (!started) return startPlayback();
  if (!player) return;
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING) player.pauseVideo();
  else if (s === YT.PlayerState.PAUSED) player.playVideo();
  else loadPlaylist();
};

$('btn-next').onclick = () => {
  if (!started) return startPlayback();
  try { player.nextVideo(); } catch(e) {}
};

$('btn-prev').onclick = () => {
  if (!started) return startPlayback();
  try { player.previousVideo(); } catch(e) {}
};

$('vol').oninput = () => {
  const v = +$('vol').value;
  try { player.setVolume(v); } catch(e) {}
  try { localStorage.setItem('mehfil-vol', v); } catch(e) {}
};

$('toggle').onclick = () => {
  $('menu').classList.toggle('open');
  $('toggle').setAttribute('aria-expanded', $('menu').classList.contains('open'));
};
document.addEventListener('click', e => {
  if (!$('toggle').contains(e.target) && !$('menu').contains(e.target))
    $('menu').classList.remove('open');
});

document.addEventListener('keydown', e => {
  if (e.target.matches('button,input,a')) return;
  if (e.code === 'Space') { e.preventDefault(); $('btn-play').click(); }
  if (e.key === 'ArrowRight') $('btn-next').click();
  if (e.key === 'ArrowLeft') $('btn-prev').click();
  const keys = Object.keys(THEMES);
  if (/^[1-6]$/.test(e.key)) choose(keys[+e.key - 1]);
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => $('btn-play').click());
  navigator.mediaSession.setActionHandler('pause', () => $('btn-play').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('btn-next').click());
  navigator.mediaSession.setActionHandler('previoustrack', () => $('btn-prev').click());
}

// ── Init ────────────────────────────────────────────────────
buildMenu();
try { active = localStorage.getItem('mehfil-theme') || active; } catch(e) {}
choose(THEMES[active] ? active : 'corporate');
</script>
</body>
</html>
