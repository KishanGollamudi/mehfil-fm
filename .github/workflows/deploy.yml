# Deploys to the Oracle Cloud ARM64 VM by building the container natively over SSH.
name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          timeout: 30s
          script: |
            cd ~/mehfil-fm
            git fetch origin main
            git reset --hard origin/main
            podman stop yt-audio-app || true
            podman rm yt-audio-app || true
            podman build -t yt-audio-app .
            podman run -d --name yt-audio-app --userns=keep-id -p 80:3000 -v /home/ubuntu/yt-data:/app/data:Z --restart unless-stopped yt-audio-app
            sleep 5
            curl -f http://localhost/health

      - name: Report deployed commit
        run: echo "Successfully deployed commit ${{ github.sha }} to Oracle VM."
